<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EngiMind Quiz</title>
<meta name="description" content="Test your knowledge of Claude Code, Git & GitHub, the terminal, and clean-code practices.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f4fb;
    --surface:#ffffff;
    --surface-2:#eef0f7;
    --border:#dde1ea;
    --text:#1b2130;
    --muted:#6b7280;
    --accent:#6f5cff;
    --accent-ink:#ffffff;
    --accent-2:#c9761a;
    --good:#1f9d55;
    --good-bg:#e5f7ec;
    --bad:#d92d2d;
    --bad-bg:#fdeaea;
    --dot-red:#ff5f56;
    --dot-yellow:#ffbd2e;
    --dot-green:#27c93f;
    --shadow: 0 20px 60px -20px rgba(20,20,50,0.25);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0b0e14;
      --surface:#121722;
      --surface-2:#1a2130;
      --border:#262f3f;
      --text:#e7ecf3;
      --muted:#8a94a6;
      --accent:#8b7cff;
      --accent-ink:#0b0e14;
      --accent-2:#ffb454;
      --good:#3ddc84;
      --good-bg:#123524;
      --bad:#ff6b6b;
      --bad-bg:#3a1c1c;
      --shadow: 0 20px 60px -20px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b0e14;
    --surface:#121722;
    --surface-2:#1a2130;
    --border:#262f3f;
    --text:#e7ecf3;
    --muted:#8a94a6;
    --accent:#8b7cff;
    --accent-ink:#0b0e14;
    --accent-2:#ffb454;
    --good:#3ddc84;
    --good-bg:#123524;
    --bad:#ff6b6b;
    --bad-bg:#3a1c1c;
    --shadow: 0 20px 60px -20px rgba(0,0,0,0.6);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:"Inter",system-ui,sans-serif;
    padding:32px 16px;
    padding-block:32px;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:100vh;
  }
  h1,h2,h3{font-family:"Space Grotesk",system-ui,sans-serif; text-wrap:balance; margin:0;}
  .mono{font-family:"JetBrains Mono",monospace;}
  img{max-width:100%;}
  [hidden]{display:none!important;}

  .app{
    width:100%;
    max-width:720px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .titlebar{
    display:flex;
    align-items:center;
    gap:16px;
    padding:12px 16px;
    background:var(--surface-2);
    border-bottom:1px solid var(--border);
  }
  .dots{display:flex; gap:7px; flex-shrink:0;}
  .dots span{width:11px; height:11px; border-radius:50%; display:block;}
  .dots .r{background:var(--dot-red);}
  .dots .y{background:var(--dot-yellow);}
  .dots .g{background:var(--dot-green);}
  .titlebar .path{font-size:12.5px; color:var(--muted); flex:1; text-align:center; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .theme-toggle{
    background:none; border:1px solid var(--border); color:var(--muted);
    border-radius:7px; padding:4px 9px; font-size:11px; cursor:pointer; font-family:"JetBrains Mono",monospace;
    flex-shrink:0;
  }
  .theme-toggle:hover{color:var(--text); border-color:var(--accent);}

  .content{padding:28px 26px 30px;}
  @media (max-width:480px){ .content{padding:20px 16px 24px;} }

  /* ---- Start screen ---- */
  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family:"JetBrains Mono",monospace; font-size:12px; letter-spacing:0.06em;
    color:var(--accent); text-transform:uppercase; margin-bottom:10px;
  }
  .eyebrow::before{content:"$"; color:var(--accent-2);}
  #start h1{font-size:clamp(26px,5vw,32px); margin-bottom:8px;}
  #start p.lede{color:var(--muted); font-size:15px; line-height:1.55; margin:0 0 24px;}

  .cats{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:22px;}
  @media (max-width:480px){ .cats{grid-template-columns:1fr;} }
  .cat-card{
    display:flex; align-items:flex-start; gap:10px;
    border:1px solid var(--border); background:var(--surface-2);
    border-radius:10px; padding:12px 13px; cursor:pointer; user-select:none;
    transition:border-color .15s ease;
  }
  .cat-card:hover{border-color:var(--accent);}
  .cat-card input{margin-top:3px; accent-color:var(--accent);}
  .cat-card .label{font-weight:600; font-size:14px;}
  .cat-card .count{display:block; color:var(--muted); font-size:12px; font-family:"JetBrains Mono",monospace; margin-top:2px;}

  .field-block{margin-bottom:18px;}
  .field-label{display:block; font-size:13px; color:var(--muted); margin-bottom:9px;}
  .row{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:8px;}
  .length-group{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{
    font-family:"JetBrains Mono",monospace; font-size:13px; padding:7px 13px;
    border-radius:999px; border:1px solid var(--border); background:var(--surface-2);
    color:var(--muted); cursor:pointer;
  }
  .chip.active{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}
  .diff-group .chip{display:inline-flex; align-items:center; gap:7px;}
  .diff-group .chip::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor; opacity:.6;}
  .diff-group .chip.active::before{opacity:1;}
  .diff-easy{color:var(--good);} .diff-easy.active{background:var(--good); border-color:var(--good); color:#0b0e14;}
  .diff-intermediate{color:var(--accent-2);} .diff-intermediate.active{background:var(--accent-2); border-color:var(--accent-2); color:#1b2130;}
  .diff-hard{color:var(--bad);} .diff-hard.active{background:var(--bad); border-color:var(--bad); color:#ffffff;}
  .pool-hint{font-size:12px; color:var(--muted); margin-bottom:22px;}

  .btn{
    font-family:"Space Grotesk",system-ui,sans-serif; font-weight:600; font-size:15px;
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:10px;
    padding:13px 22px; cursor:pointer; width:100%;
  }
  .btn:hover{filter:brightness(1.06);}
  .btn:disabled{opacity:.5; cursor:not-allowed;}
  .btn.secondary{background:transparent; color:var(--text); border:1px solid var(--border); width:auto;}

  .best-score{margin-top:16px; text-align:center; color:var(--muted); font-size:12.5px; font-family:"JetBrains Mono",monospace;}

  /* ---- Quiz screen ---- */
  .quiz-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:10px;}
  .tag{
    font-family:"JetBrains Mono",monospace; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em;
    padding:4px 9px; border-radius:6px; background:var(--surface-2); color:var(--accent); border:1px solid var(--border);
  }
  .tag.tag-easy{color:var(--good); border-color:var(--good);}
  .tag.tag-intermediate{color:var(--accent-2); border-color:var(--accent-2);}
  .tag.tag-hard{color:var(--bad); border-color:var(--bad);}
  .counter{font-family:"JetBrains Mono",monospace; font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums;}
  .progress-track{height:6px; background:var(--surface-2); border-radius:99px; overflow:hidden; margin-bottom:22px;}
  .progress-fill{height:100%; background:var(--accent); width:0%; transition:width .25s ease;}

  #question-text{font-size:19px; line-height:1.45; margin-bottom:20px;}

  .options{display:flex; flex-direction:column; gap:10px; margin-bottom:6px;}
  .option{
    text-align:left; display:flex; align-items:center; gap:12px;
    border:1px solid var(--border); background:var(--surface-2); color:var(--text);
    border-radius:10px; padding:13px 14px; font-size:14.5px; font-family:"Inter",sans-serif;
    cursor:pointer; transition:border-color .12s ease, background .12s ease;
  }
  .option:hover:not(:disabled){border-color:var(--accent);}
  .option .k{
    font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--muted);
    border:1px solid var(--border); border-radius:5px; width:22px; height:22px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  .option:disabled{cursor:default;}
  .option.correct{background:var(--good-bg); border-color:var(--good);}
  .option.correct .k{border-color:var(--good); color:var(--good);}
  .option.incorrect{background:var(--bad-bg); border-color:var(--bad);}
  .option.incorrect .k{border-color:var(--bad); color:var(--bad);}

  .explain{
    margin-top:16px; padding:13px 14px; border-radius:10px; background:var(--surface-2);
    border:1px solid var(--border); font-size:13.5px; line-height:1.5; color:var(--muted);
  }
  .explain b{color:var(--text);}
  .explain.hidden-init{display:none;}

  .quiz-foot{display:flex; justify-content:flex-end; margin-top:20px;}
  #next-btn{width:auto; padding:12px 24px;}

  /* ---- Results screen ---- */
  #results .score-hero{text-align:center; padding:6px 0 26px;}
  #results .score-hero .pct{
    font-family:"JetBrains Mono",monospace; font-weight:700; font-size:56px; color:var(--accent);
    font-variant-numeric:tabular-nums; line-height:1;
  }
  #results .score-hero .frac{color:var(--muted); font-size:14px; margin-top:8px; font-family:"JetBrains Mono",monospace;}
  #results .score-hero .verdict{margin-top:10px; font-size:15px; font-weight:600;}

  .breakdown{display:flex; flex-direction:column; gap:12px; margin-bottom:24px;}
  .bd-row{display:flex; align-items:center; gap:12px;}
  .bd-row .bd-label{width:130px; flex-shrink:0; font-size:13px; color:var(--muted);}
  .bd-row .bd-track{flex:1; height:9px; background:var(--surface-2); border-radius:99px; overflow:hidden;}
  .bd-row .bd-fill{height:100%; background:var(--accent); border-radius:99px;}
  .bd-row .bd-val{width:44px; flex-shrink:0; text-align:right; font-family:"JetBrains Mono",monospace; font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums;}

  .review-toggle{
    background:none; border:1px solid var(--border); color:var(--text); border-radius:8px;
    padding:9px 14px; font-size:13px; cursor:pointer; font-family:"Inter",sans-serif; margin-bottom:14px;
  }
  #review-list{display:flex; flex-direction:column; gap:10px; margin-bottom:22px;}
  .review-item{border:1px solid var(--border); background:var(--surface-2); border-radius:10px; padding:12px 14px;}
  .review-item .rq{font-size:13.5px; font-weight:600; margin-bottom:6px;}
  .review-item .ra{font-size:12.5px; line-height:1.5;}
  .review-item .ra.wrong{color:var(--bad);}
  .review-item .ra.right{color:var(--good);}
  .review-item .rex{font-size:12.5px; color:var(--muted); margin-top:6px;}

  .results-actions{display:flex; gap:10px; flex-wrap:wrap;}
  .results-actions .btn{flex:1;}

  footer.credit{text-align:center; color:var(--muted); font-size:11.5px; margin-top:14px; font-family:"JetBrains Mono",monospace;}
</style>
</head>
<body>

<div class="app" id="app">
  <div class="titlebar">
    <div class="dots"><span class="r"></span><span class="y"></span><span class="g"></span></div>
    <div class="path mono" id="path-label">engimind@quiz:~$ start</div>
    <button class="theme-toggle" id="theme-toggle" type="button">theme</button>
  </div>

  <div class="content">

    <!-- START -->
    <section id="start">
      <div class="eyebrow">EngiMind</div>
      <h1>Dev Fundamentals Quiz</h1>
      <p class="lede">40 questions on Claude Code, Git &amp; GitHub, the terminal, and clean-code practices. Pick your categories, pick a length, and go.</p>

      <div class="cats" id="cats">
        <label class="cat-card"><input type="checkbox" value="claude" checked><span><span class="label">Claude Code</span><span class="count">10 questions</span></span></label>
        <label class="cat-card"><input type="checkbox" value="git" checked><span><span class="label">Git &amp; GitHub</span><span class="count">10 questions</span></span></label>
        <label class="cat-card"><input type="checkbox" value="terminal" checked><span><span class="label">Terminal</span><span class="count">10 questions</span></span></label>
        <label class="cat-card"><input type="checkbox" value="clean" checked><span><span class="label">Clean Code</span><span class="count">10 questions</span></span></label>
      </div>

      <div class="field-block">
        <span class="field-label">Difficulty</span>
        <div class="length-group diff-group" id="difficulty-group">
          <button class="chip diff-easy" data-diff="easy">Easy</button>
          <button class="chip diff-intermediate" data-diff="intermediate">Intermediate</button>
          <button class="chip diff-hard" data-diff="hard">Hard</button>
          <button class="chip active" data-diff="mixed">Mixed</button>
        </div>
      </div>

      <div class="row">
        <span style="font-size:13px; color:var(--muted);">Quiz length</span>
        <div class="length-group" id="length-group">
          <button class="chip" data-len="10">10</button>
          <button class="chip" data-len="20">20</button>
          <button class="chip active" data-len="all">All</button>
        </div>
      </div>
      <div class="pool-hint mono" id="pool-hint"></div>

      <button class="btn" id="start-btn" type="button">Start quiz</button>
      <div class="best-score" id="best-score" hidden></div>
    </section>

    <!-- QUIZ -->
    <section id="quiz" hidden>
      <div class="quiz-head">
        <span style="display:flex; gap:8px;">
          <span class="tag" id="q-tag">CATEGORY</span>
          <span class="tag" id="q-diff">LEVEL</span>
        </span>
        <span class="counter" id="q-counter">1 / 10</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <h3 id="question-text">Question text</h3>
      <div class="options" id="options"></div>
      <div class="explain hidden-init" id="explain"></div>
      <div class="quiz-foot">
        <button class="btn" id="next-btn" type="button" disabled>Next</button>
      </div>
    </section>

    <!-- RESULTS -->
    <section id="results" hidden>
      <div class="score-hero">
        <div class="pct mono" id="result-pct">0%</div>
        <div class="frac" id="result-frac">0 / 0 correct</div>
        <div class="verdict" id="result-verdict"></div>
      </div>

      <div class="breakdown" id="breakdown"></div>

      <button class="review-toggle" id="review-toggle" type="button">Show answer review ▾</button>
      <div id="review-list" hidden></div>

      <div class="results-actions">
        <button class="btn secondary" id="retry-btn" type="button">Retake same quiz</button>
        <button class="btn" id="restart-btn" type="button">New quiz</button>
      </div>
    </section>

  </div>
</div>
<footer class="credit">EngiMind · built with Claude Code</footer>

<script>
(function(){
  "use strict";

  var QUESTIONS = {
    claude: [
      {q:"In Claude Code, what is a \"slash command\"?", opts:["A prompt template you invoke by typing /<name> in the chat","A keyboard shortcut for switching terminal tabs","A type of Git branch naming convention","A CSS selector used in the settings UI"], a:0, d:"easy", ex:"Slash commands (like /init or /review) are typed at the start of a message and insert a prompt template or trigger a built-in action."},
      {q:"Which built-in slash command generates a CLAUDE.md file documenting your codebase?", opts:["/docs","/init","/build","/scan"], a:1, d:"easy", ex:"/init inspects the repo and writes a CLAUDE.md with project-specific context for future sessions."},
      {q:"What best describes \"hooks\" in Claude Code?", opts:["Visual themes for the terminal UI","Shortcuts for renaming files","Deterministic scripts that fire automatically at defined lifecycle events, like before a tool runs","A way to bookmark chat messages"], a:2, d:"intermediate", ex:"Hooks are automatic commands (command, http, prompt, or agent handlers) triggered by lifecycle events such as a tool call or session start — no manual typing required."},
      {q:"What is a \"subagent\" used for in Claude Code?", opts:["Formatting code automatically on save","A delegated, isolated agent loop with its own context window for a specific task","A backup copy of your git history","A linter plugin for JavaScript"], a:1, d:"hard", ex:"Subagents are spawned when a task needs its own separate context window, not just a different prompt — useful for research or isolated multi-step work."},
      {q:"Which slash command is used to review the current diff or pending changes for bugs?", opts:["/diff-check","/code-review","/lint","/patch"], a:1, d:"easy", ex:"/code-review (also available as /review) analyzes the current changes and reports correctness issues."},
      {q:"What does the /compact command do?", opts:["Deletes old commits from the repo","Minifies JavaScript files in the project","Compresses and summarizes the conversation to free up context window space","Shrinks image assets automatically"], a:2, d:"intermediate", ex:"/compact summarizes prior conversation so a long session can continue without running out of context."},
      {q:"What is an MCP server, in the context of Claude Code?", opts:["A Minecraft plugin server","A Model Context Protocol server that exposes external tools or data sources Claude can call","A backup mail server for notifications","A type of Git remote"], a:1, d:"hard", ex:"MCP (Model Context Protocol) servers let Claude Code connect to external tools, APIs, and data sources through a standard interface."},
      {q:"Where do teams typically store project-specific instructions and context for Claude Code?", opts:["package.json","CLAUDE.md",".gitignore","settings.ini"], a:1, d:"easy", ex:"CLAUDE.md is the conventional file for persistent, project-specific guidance that Claude Code reads for context."},
      {q:"What does a Claude Code \"plugin\" bundle together?", opts:["Only slash commands, nothing else","Skills, subagents, slash commands, hooks, output styles, and MCP server definitions as one installable unit","A single CSS theme file","Only MCP servers"], a:1, d:"hard", ex:"A plugin is a versioned bundle that can ship multiple extension types together so they install and update as one unit."},
      {q:"Which command lets you check current context window usage in a session?", opts:["/usage","/context","/memory","/tokens"], a:1, d:"intermediate", ex:"/context reports how much of the context window is currently used, helping you decide when to compact."}
    ],
    git: [
      {q:"What is a \"commit\" in Git?", opts:["A request to delete a branch","A snapshot of your project's changes saved to the repository history","A live sync between two remote servers","A GitHub-only feature with no local equivalent"], a:1, d:"easy", ex:"Each commit captures the state of your files at that moment, building a traceable project history."},
      {q:"Which command creates a new branch and switches to it in a single step?", opts:["git branch -m <name>","git checkout -b <name>","git merge <name>","git log --branch <name>"], a:1, d:"intermediate", ex:"git checkout -b <name> (or the newer git switch -c <name>) creates and checks out a branch in one command."},
      {q:"What is a \"pull request\" on GitHub?", opts:["A request to download the entire repository","A proposal to merge changes from one branch into another, opened for review before merging","A command that force-pushes to main","An automatic backup of your local commits"], a:1, d:"intermediate", ex:"Pull requests let collaborators discuss and review a set of changes before they're merged into the target branch."},
      {q:"What does git clone do?", opts:["Deletes a remote repository","Copies a remote repository, including its full history, to your local machine","Creates a duplicate branch in the same repo","Compresses your repository into a zip file"], a:1, d:"easy", ex:"git clone downloads a full copy of a repository (history included) and sets up the remote for you."},
      {q:"What's the key difference between git fetch and git pull?", opts:["They are exactly the same command","fetch downloads changes without merging them; pull fetches and then merges into your current branch","fetch only works on GitHub, pull only works locally","pull deletes remote branches, fetch does not"], a:1, d:"hard", ex:"git fetch updates your local view of the remote without touching your working branch; git pull does that plus a merge (or rebase)."},
      {q:"What is a \"merge conflict\"?", opts:["A GitHub billing error","When two people star the same repository","When Git can't automatically reconcile changes to the same lines and needs manual resolution","A warning shown when a commit message is too long"], a:2, d:"hard", ex:"Conflicts happen when overlapping changes can't be auto-merged; you resolve them by editing the conflicted files and committing the result."},
      {q:"What does a .gitignore file do?", opts:["Lists commit messages to reject","Specifies files and patterns that Git should not track or stage","Encrypts sensitive files automatically","Blocks specific GitHub users from a repo"], a:1, d:"easy", ex:"Patterns in .gitignore (like node_modules/ or .env) tell Git to leave matching files untracked."},
      {q:"What is \"GitHub Flow\"?", opts:["A diagramming tool built into GitHub","A lightweight workflow: branch, commit, open a pull request, review, then merge to main","A paid GitHub subscription tier","A CI/CD pipeline exclusive to Actions"], a:1, d:"hard", ex:"GitHub Flow is a simple branch-per-feature workflow well suited to continuous delivery."},
      {q:"Which command stages changes so they're included in the next commit?", opts:["git stage-all","git commit --stage","git add","git track"], a:2, d:"easy", ex:"git add moves changes from the working directory into the staging area, ready to be committed."},
      {q:"What is a \"fork\" on GitHub?", opts:["A temporary branch that auto-deletes after 24 hours","A personal copy of someone else's repository under your own account, so you can change it independently","A tool for merging two unrelated repositories","A type of GitHub Action trigger"], a:1, d:"intermediate", ex:"Forking creates your own copy of a repo, commonly used to contribute to projects you don't have write access to."}
    ],
    terminal: [
      {q:"What does the pwd command print?", opts:["A list of installed packages","The full path of the current working directory","The current user's password hash","The permissions of the current folder"], a:1, d:"easy", ex:"pwd stands for \"print working directory\" and shows where you currently are in the filesystem."},
      {q:"Which flag makes ls also show hidden files (those starting with a dot)?", opts:["ls -a","ls -h","ls -x","ls -r"], a:0, d:"easy", ex:"ls -a lists all entries, including hidden dotfiles like .gitignore or .env."},
      {q:"What does cd .. do?", opts:["Deletes the current directory","Copies the current directory","Moves up one level to the parent directory","Creates a directory named \"..\""], a:2, d:"easy", ex:"\"..\" refers to the parent directory, so cd .. moves you up one level in the folder tree."},
      {q:"What does grep \"error\" file.log do?", opts:["Deletes every line containing \"error\"","Searches file.log and prints lines that contain \"error\"","Renames file.log to \"error\"","Counts the total lines in file.log"], a:1, d:"intermediate", ex:"grep searches text for a pattern and prints the matching lines — a core tool for scanning logs."},
      {q:"What does chmod +x script.sh do?", opts:["Compresses script.sh","Makes script.sh executable","Deletes script.sh permanently","Moves script.sh to the trash"], a:1, d:"intermediate", ex:"chmod changes file permissions; +x adds the execute permission so the script can be run directly."},
      {q:"What does mkdir -p a/b/c do?", opts:["Fails if folder \"a\" doesn't already exist","Creates nested folders a/b/c, creating any missing parent folders along the way","Deletes folders a, b, and c","Lists the contents of folder a/b/c"], a:1, d:"intermediate", ex:"The -p flag makes mkdir create all necessary parent directories instead of erroring out."},
      {q:"What does the pipe operator | do in the terminal?", opts:["Comments out the rest of the line","Runs two unrelated commands in parallel with no connection","Sends the output of one command as input to the next command","Redirects output to a file only"], a:2, d:"hard", ex:"Piping chains commands together, e.g. cat file.log | grep error, so data flows from one to the next."},
      {q:"Why is rm -rf considered risky?", opts:["It only works on Windows","It recursively and forcibly deletes files/directories with no confirmation, which can permanently destroy data if misused","It renames files instead of deleting them","It requires an internet connection to run"], a:1, d:"hard", ex:"-r deletes recursively and -f skips confirmation prompts, so a wrong path can wipe out data with no undo."},
      {q:"What does the cat command do?", opts:["Displays the contents of a file in the terminal","Compiles source code","Checks disk space usage","Lists active network connections"], a:0, d:"easy", ex:"cat (short for \"concatenate\") prints one or more files' contents to standard output."},
      {q:"What does the top (or ps) command show?", opts:["A list of recently deleted files","Currently running processes and their resource usage","The contents of the clipboard","A history of terminal commands you've typed"], a:1, d:"hard", ex:"top and ps report live information about running processes, including CPU and memory usage."}
    ],
    clean: [
      {q:"What does the DRY principle stand for?", opts:["Design Rarely, Yield often","Don't Repeat Yourself","Data Rules Yearly","Debug Right Yesterday"], a:1, d:"easy", ex:"DRY encourages extracting repeated logic into a single reusable function or module instead of duplicating it."},
      {q:"What does KISS mean in the context of coding practice?", opts:["Keep It Simple, Stupid — favor the simplest solution that works","Keep Iterating, Stay Solid","Key Interfaces, Shared State","Kill Idle Server Sessions"], a:0, d:"easy", ex:"KISS reminds you to avoid unnecessary complexity, patterns, or abstractions when a simpler solution does the job."},
      {q:"What is the \"Single Responsibility Principle\"?", opts:["Only one developer should ever touch a file","A function, class, or module should do one thing and have one reason to change","Every project should have a single main branch","Code should only ever call one external library"], a:1, d:"intermediate", ex:"Keeping each unit focused on one responsibility makes code easier to understand, test, and change safely."},
      {q:"Why are meaningful variable and function names important?", opts:["They make the compiled binary smaller","They make code self-explanatory, reducing the need for extra comments to explain intent","They are required by all programming languages","They increase runtime performance"], a:1, d:"easy", ex:"Descriptive names (like totalPrice instead of x) let readers understand intent directly from the code."},
      {q:"What is a \"code smell\"?", opts:["A compiler error that stops the build","A surface sign in code that usually points to a deeper design or maintainability problem","A type of code comment format","A security certificate warning"], a:1, d:"intermediate", ex:"Code smells (like duplicated logic or overly long functions) aren't bugs themselves, but they hint that refactoring may be needed."},
      {q:"Why should comments generally explain \"why\" rather than \"what\"?", opts:["Comments explaining \"what\" are required by law in most style guides","Well-named, well-structured code already shows what it does, so comments are most valuable for non-obvious reasoning","\"Why\" comments compile faster","Comments should never be used at all"], a:1, d:"intermediate", ex:"If code needs a comment to explain what it does, clearer naming or structure is often the better fix; comments earn their place explaining non-obvious decisions."},
      {q:"What is \"refactoring\"?", opts:["Adding new features to an application","Restructuring existing code to improve its readability or design without changing its external behavior","Rewriting code in a different programming language","Deleting unused files from a repository"], a:1, d:"easy", ex:"Refactoring improves internal structure while keeping observable behavior the same — ideally backed by tests."},
      {q:"What is a \"unit test\"?", opts:["A test that checks an entire application end-to-end through the UI","A test that verifies a small, isolated piece of code, like a single function, behaves correctly","A manual QA checklist run before release","A test that only checks server uptime"], a:1, d:"hard", ex:"Unit tests target small, isolated pieces of logic, making failures fast to locate and fix."},
      {q:"What does YAGNI stand for?", opts:["Yield And Get Nothing Immediately","You Aren't Gonna Need It — avoid building functionality before it's actually needed","Yes, Add New Interfaces","Your API Grows, Not Improves"], a:1, d:"hard", ex:"YAGNI discourages speculative features or abstractions built for hypothetical future requirements that may never arrive."},
      {q:"Why is version control considered a coding best practice?", opts:["It automatically fixes bugs in your code","It tracks history, enables collaboration, and lets you revert to previous working states","It replaces the need for testing","It is only useful for large teams, never solo projects"], a:1, d:"hard", ex:"Version control (like Git) gives you a safety net and a collaboration mechanism, regardless of project size."}
    ]
  };

  var CAT_LABEL = {claude:"Claude Code", git:"Git & GitHub", terminal:"Terminal", clean:"Clean Code"};
  var CAT_ORDER = ["claude","git","terminal","clean"];
  var DIFF_LABEL = {easy:"Easy", intermediate:"Intermediate", hard:"Hard", mixed:"Mixed"};

  var state = { pool: [], idx: 0, score: 0, answers: [], selectedLen: "all", selectedDifficulty: "mixed" };

  var el = {
    start: document.getElementById("start"),
    quiz: document.getElementById("quiz"),
    results: document.getElementById("results"),
    cats: document.getElementById("cats"),
    lengthGroup: document.getElementById("length-group"),
    diffGroup: document.getElementById("difficulty-group"),
    poolHint: document.getElementById("pool-hint"),
    startBtn: document.getElementById("start-btn"),
    bestScore: document.getElementById("best-score"),
    pathLabel: document.getElementById("path-label"),
    qTag: document.getElementById("q-tag"),
    qDiff: document.getElementById("q-diff"),
    qCounter: document.getElementById("q-counter"),
    progressFill: document.getElementById("progress-fill"),
    questionText: document.getElementById("question-text"),
    options: document.getElementById("options"),
    explain: document.getElementById("explain"),
    nextBtn: document.getElementById("next-btn"),
    resultPct: document.getElementById("result-pct"),
    resultFrac: document.getElementById("result-frac"),
    resultVerdict: document.getElementById("result-verdict"),
    breakdown: document.getElementById("breakdown"),
    reviewToggle: document.getElementById("review-toggle"),
    reviewList: document.getElementById("review-list"),
    retryBtn: document.getElementById("retry-btn"),
    restartBtn: document.getElementById("restart-btn"),
    themeToggle: document.getElementById("theme-toggle")
  };

  function shuffle(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function getSelectedCategories(){
    var boxes = el.cats.querySelectorAll("input[type=checkbox]");
    var out = [];
    boxes.forEach(function(b){ if (b.checked) out.push(b.value); });
    return out;
  }

  function updatePoolHint(){
    var cats = getSelectedCategories();
    if (cats.length === 0) cats = CAT_ORDER.slice();
    var available = buildPool(cats, "all", state.selectedDifficulty).length;
    var lenLabel = state.selectedLen === "all" ? available : Math.min(Number(state.selectedLen), available);
    el.poolHint.textContent = available + " question" + (available === 1 ? "" : "s") + " match this setup — quiz will use " + lenLabel + ".";
  }

  function buildPool(cats, len, difficulty){
    var pool = [];
    cats.forEach(function(c){
      (QUESTIONS[c] || []).forEach(function(item){
        if (difficulty !== "mixed" && item.d !== difficulty) return;
        pool.push({ cat: c, q: item.q, opts: item.opts, a: item.a, d: item.d, ex: item.ex });
      });
    });
    pool = shuffle(pool);
    if (len !== "all") pool = pool.slice(0, Math.min(Number(len), pool.length));
    return pool;
  }

  function readBest(){
    try {
      var v = localStorage.getItem("engimind_quiz_best");
      return v ? JSON.parse(v) : null;
    } catch (e) { return null; }
  }
  function writeBest(pct){
    try {
      var cur = readBest();
      if (!cur || pct > cur.pct) localStorage.setItem("engimind_quiz_best", JSON.stringify({ pct: pct, date: new Date().toISOString() }));
    } catch (e) {}
  }
  function showBest(){
    var b = readBest();
    if (b) {
      el.bestScore.hidden = false;
      el.bestScore.textContent = "Best score so far: " + b.pct + "%";
    }
  }

  function showScreen(name){
    el.start.hidden = name !== "start";
    el.quiz.hidden = name !== "quiz";
    el.results.hidden = name !== "results";
  }

  function startQuiz(){
    var cats = getSelectedCategories();
    if (cats.length === 0) { cats = CAT_ORDER.slice(); }
    state.pool = buildPool(cats, state.selectedLen, state.selectedDifficulty);
    state.idx = 0;
    state.score = 0;
    state.answers = [];
    showScreen("quiz");
    renderQuestion();
  }

  function renderQuestion(){
    var item = state.pool[state.idx];
    el.qTag.textContent = CAT_LABEL[item.cat];
    el.qDiff.textContent = DIFF_LABEL[item.d];
    el.qDiff.className = "tag tag-" + item.d;
    el.qCounter.textContent = (state.idx + 1) + " / " + state.pool.length;
    el.pathLabel.textContent = "engimind@quiz:~$ question " + (state.idx + 1);
    el.progressFill.style.width = ((state.idx) / state.pool.length * 100) + "%";
    el.questionText.textContent = item.q;
    el.explain.classList.add("hidden-init");
    el.explain.textContent = "";
    el.nextBtn.disabled = true;
    el.nextBtn.textContent = (state.idx === state.pool.length - 1) ? "See results" : "Next";

    el.options.innerHTML = "";
    var keys = ["A","B","C","D"];
    item.opts.forEach(function(optText, i){
      var b = document.createElement("button");
      b.className = "option";
      b.type = "button";
      b.innerHTML = '<span class="k mono">' + keys[i] + '</span><span>' + optText + '</span>';
      b.addEventListener("click", function(){ selectOption(i); });
      el.options.appendChild(b);
    });
  }

  function selectOption(i){
    var item = state.pool[state.idx];
    var correct = i === item.a;
    var buttons = el.options.querySelectorAll(".option");
    buttons.forEach(function(b, idx){
      b.disabled = true;
      if (idx === item.a) b.classList.add("correct");
      if (idx === i && !correct) b.classList.add("incorrect");
    });
    if (correct) state.score++;
    state.answers.push({ q: item.q, cat: item.cat, chosen: i, correctIdx: item.a, correct: correct, opts: item.opts, ex: item.ex });

    el.explain.classList.remove("hidden-init");
    el.explain.innerHTML = "<b>" + (correct ? "Correct." : "Not quite.") + "</b> " + item.ex;
    el.nextBtn.disabled = false;
  }

  function nextQuestion(){
    state.idx++;
    if (state.idx >= state.pool.length) {
      el.progressFill.style.width = "100%";
      finishQuiz();
    } else {
      renderQuestion();
    }
  }

  function finishQuiz(){
    var total = state.pool.length;
    var pct = Math.round((state.score / total) * 100);
    el.resultPct.textContent = pct + "%";
    el.resultFrac.textContent = state.score + " / " + total + " correct";

    var verdict;
    if (pct === 100) verdict = "Perfect run.";
    else if (pct >= 80) verdict = "Strong grasp of the fundamentals.";
    else if (pct >= 50) verdict = "Solid start — a bit more practice will help.";
    else verdict = "Worth another pass through the material.";
    el.resultVerdict.textContent = verdict;

    var byCat = {};
    CAT_ORDER.forEach(function(c){ byCat[c] = { correct: 0, total: 0 }; });
    state.answers.forEach(function(a){
      if (!byCat[a.cat]) byCat[a.cat] = { correct: 0, total: 0 };
      byCat[a.cat].total++;
      if (a.correct) byCat[a.cat].correct++;
    });

    el.breakdown.innerHTML = "";
    CAT_ORDER.forEach(function(c){
      var d = byCat[c];
      if (!d.total) return;
      var p = Math.round((d.correct / d.total) * 100);
      var row = document.createElement("div");
      row.className = "bd-row";
      row.innerHTML =
        '<span class="bd-label">' + CAT_LABEL[c] + '</span>' +
        '<span class="bd-track"><span class="bd-fill" style="width:' + p + '%"></span></span>' +
        '<span class="bd-val">' + d.correct + '/' + d.total + '</span>';
      el.breakdown.appendChild(row);
    });

    el.reviewList.innerHTML = "";
    state.answers.forEach(function(a, i){
      var div = document.createElement("div");
      div.className = "review-item";
      var chosenText = a.opts[a.chosen];
      var correctText = a.opts[a.correctIdx];
      var ansHtml = a.correct
        ? '<div class="ra right">✓ You answered: ' + chosenText + '</div>'
        : '<div class="ra wrong">✗ You answered: ' + chosenText + '</div><div class="ra right">✓ Correct: ' + correctText + '</div>';
      div.innerHTML =
        '<div class="rq">' + (i + 1) + '. ' + a.q + '</div>' +
        ansHtml +
        '<div class="rex">' + a.ex + '</div>';
      el.reviewList.appendChild(div);
    });
    el.reviewList.hidden = true;
    el.reviewToggle.textContent = "Show answer review ▾";

    el.pathLabel.textContent = "engimind@quiz:~$ results";
    writeBest(pct);
    showScreen("results");
  }

  el.startBtn.addEventListener("click", startQuiz);
  el.nextBtn.addEventListener("click", nextQuestion);
  el.retryBtn.addEventListener("click", startQuiz);
  el.restartBtn.addEventListener("click", function(){
    el.pathLabel.textContent = "engimind@quiz:~$ start";
    showScreen("start");
    showBest();
    updatePoolHint();
  });

  el.reviewToggle.addEventListener("click", function(){
    var hidden = el.reviewList.hidden;
    el.reviewList.hidden = !hidden;
    el.reviewToggle.textContent = hidden ? "Hide answer review ▴" : "Show answer review ▾";
  });

  el.lengthGroup.addEventListener("click", function(e){
    var chip = e.target.closest(".chip");
    if (!chip) return;
    el.lengthGroup.querySelectorAll(".chip").forEach(function(c){ c.classList.remove("active"); });
    chip.classList.add("active");
    state.selectedLen = chip.getAttribute("data-len");
    updatePoolHint();
  });

  el.diffGroup.addEventListener("click", function(e){
    var chip = e.target.closest(".chip");
    if (!chip) return;
    el.diffGroup.querySelectorAll(".chip").forEach(function(c){ c.classList.remove("active"); });
    chip.classList.add("active");
    state.selectedDifficulty = chip.getAttribute("data-diff");
    updatePoolHint();
  });

  el.cats.addEventListener("change", updatePoolHint);

  el.themeToggle.addEventListener("click", function(){
    var root = document.documentElement;
    var cur = root.getAttribute("data-theme");
    if (cur === "dark") root.setAttribute("data-theme", "light");
    else if (cur === "light") root.removeAttribute("data-theme");
    else root.setAttribute("data-theme", "dark");
  });

  showBest();
  updatePoolHint();
})();
</script>

</body>
</html>
